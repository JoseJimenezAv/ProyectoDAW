<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../../../globales/base.css">
    <link rel="stylesheet" href="login.css">
</head>
<body style="padding-top: 156px; background-color: #1F4D3A; background-size: cover; font-family: var(--fuente-principal);">
    <a href="../../index.html" style="position: absolute; top: 22px; left: 12px; font-size: 13px; font-weight: 700; color: #FFFFFF; text-decoration: none;">Volver al sitio</a>
    <main style="width: 344px; margin: 0 auto; padding: 28px; background-color: #FFFFFF; border-radius: 20px;">
        <div style="width: auto; margin: 0 auto; padding: 28px; background-color: #FFFFFF; border-radius: 20px;">
            <span>Viaje<b style="color: #FF6B4A;">EC</b></span>
            <span style="font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #0E7C86;">Área protegida</span>
            <h1 style="margin: 8px 0; font-family: var(--fuente-titulos); font-weight: 600; font-size: 26px; color: #1F4D3A;">Acceso administrador</h1>
            <p style="margin-bottom: 24px; font-size: 11px; color: #66726D;">Gestiona las reservas y el contenido de la plataforma.</p>

            <form id="formulario">
                <label for="usuario" style="display: block; margin-bottom: 8px; font-size: 11px; font-weight: 700; color: #1F4D3A;">Usuario</label>
                <input type="text" id="usuario" placeholder="admin" style="width: 232px; height: 38px; margin-bottom: 18px; padding: 0 12px; border: 1px solid #E5E1DA; border-radius: 8px; background-color: #F6EFE3; font-family: var(--fuente-principal); font-size: 13px; color: #1F4D3A;">

                <label for="clave" style="display: block; margin-bottom: 8px; font-size: 11px; font-weight: 700; color: #1F4D3A;">Contraseña</label>
                <div style="position: relative;">
                    <input type="password" id="clave" placeholder="admin123" style="width: 232px; height: 38px; margin-bottom: 18px; padding: 0 12px; border: 1px solid #E5E1DA; border-radius: 8px; background-color: #F6EFE3; font-family: var(--fuente-principal); font-size: 13px; color: #1F4D3A;">
                    <button type="button" id="mostrar" style="position: absolute; top: 12px; right: 12px; border: none; background: none; font-size: 10px; font-weight: 700; color: #0E7C86; cursor: pointer;">Mostrar</button>
                </div>

                <small id="error" style="display: block; height: 14px; margin-bottom: 6px; font-size: 11px; color: #c0392b;"></small>
                <button type="submit" class="btn-ingresar" style="width: 232px; height: 38px; border: none; border-radius: 10px; background-color: #FF6B4A; font-family: var(--fuente-titulos); font-weight: 700; font-size: 13px; color: #FFFFFF; cursor: pointer;">Ingresar</button>
            </form>

            <small style="display: block; margin-top: 16px; text-align: center; font-size: 11px; color: #66726D;">Demo: admin / admin123</small>
            </div>
    </main>
   
    <script src="login.js"></script>
</body>
</html>
